<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evaluación de Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Examen de Paint para niños de 3 a 7 años: elegir nivel → preguntas una por una → estrellas. */
:root{
  color-scheme:light;
  --bg:#fff6d6;
  --ink:#2b2140;
  --muted:#6d6385;
  --head:#6c35a8;
  --band:#ffe94d;
  --line:#e5dcf5;
  --good:#2f9e44;
  --goodbg:#e3f8e6;
  --bad:#e03131;
  --badbg:#ffe5e5;
  --sel:#2f80ed;
  --font:'Fredoka','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 18px/1.3 var(--font);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}

/* Encabezado como la hoja impresa */
.top h1{margin:0;background:var(--head);color:#fff;text-align:center;font:700 clamp(22px,5vw,32px)/1.2 var(--font);padding:10px 60px;position:relative}
.top .sub{background:var(--band);color:#3b2a00;text-align:center;font:700 16px var(--font);padding:4px;letter-spacing:1px}
.home{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;padding:6px 12px;font-size:18px}

/* Inicio */
.hero{text-align:center;margin:26px 0 14px}
.hero .big{font-size:70px;line-height:1}
.hero h2{font-size:28px;margin:8px 0 0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.lvl{border:0;border-radius:26px;padding:20px 12px;text-align:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.lvl:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lvl .e{font-size:60px;line-height:1.1}
.lvl .n{font-size:28px;font-weight:700}
.lvl .a{display:inline-block;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 14px;margin-top:4px;font-size:20px}

/* Progreso */
.bar{display:flex;align-items:center;gap:12px;margin:16px 0 10px}
.tag{border-radius:99px;padding:4px 14px;color:#fff;white-space:nowrap}
.prog{flex:1;height:16px;background:#fff;border-radius:99px;border:3px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb636,#ff7aa2);transition:width .4s}
.count{color:var(--muted);white-space:nowrap}

/* Pregunta */
.card{background:#fff;border-radius:26px;padding:20px 18px 22px;box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.qhead{display:flex;gap:12px;align-items:center}
.qtext{flex:1;font-size:clamp(22px,4vw,28px);line-height:1.25}
.say{flex:none;border:0;background:#fff1c2;border-radius:50%;width:50px;height:50px;font-size:24px;padding:0}
.qimg{display:flex;justify-content:center;margin-top:12px}
.qimg svg{width:min(180px,50vw);height:auto}

.opts{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.list{grid-template-columns:1fr}
.opt{position:relative;border:4px solid var(--line);background:#fff;border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.opt:disabled{cursor:default}
.opts.list .opt{flex-direction:row;padding:14px 18px;gap:14px;text-align:left}
.oic svg{width:100px;height:100px;display:block}
.oic .emoji{font-size:82px;line-height:100px;display:block}
.opts.list .oic svg{width:52px;height:52px}
.opts.list .oic .emoji{font-size:44px;line-height:52px}
.otxt{font-size:22px}
kbd{display:inline-block;min-width:56px;padding:8px 12px;border-radius:10px;background:#f4f4f7;border:2px solid #9a9aa8;border-bottom-width:6px;font:700 21px var(--font);color:#333;text-align:center}
.okbd{display:flex;align-items:center;gap:6px;font-size:22px}
.ohtml{font:400 34px Georgia,'Times New Roman',serif;color:#222;padding:8px 0}
.opt.correct{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.opt.correct::after,.opt.wrong::after{position:absolute;right:8px;top:6px;font-size:28px}
.opt.correct::after{content:"✅"}
.opt.wrong::after{content:"❌"}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

/* Arrastrar y soltar */
.targets{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.target{display:flex;flex-direction:column;align-items:center;gap:8px}
.tic svg{width:96px;height:96px;display:block}
.tic.shadow svg{filter:brightness(0);opacity:.22}
.tic .emoji{font-size:80px;line-height:96px;display:block}
.fix svg{width:48px;height:48px;display:block}
.targets.order{grid-template-columns:1fr}
.targets.order .target{flex-direction:row}
.targets.order.pics{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.targets.order.pics .target{flex-direction:column}
.tnum{flex:none;width:54px;height:54px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-size:30px;font-weight:700}
.chip.step{background:#7e57c2;font-size:18px;text-align:left}
.row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.row svg{width:64px;height:64px;display:block}
.row .q{width:64px;height:64px;border:4px dashed #b9abd9;border-radius:14px;display:grid;place-items:center;font-size:34px;color:var(--head)}
.subs{display:grid;gap:16px;margin-top:10px}
.sb{border:0;border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:left}
.sb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sb .e{font-size:50px;line-height:1}
.sb .n{font-size:28px;font-weight:700}
.sb .s{font-size:24px;letter-spacing:2px}
.sb.b1{background:#43a047}.sb.b2{background:#f08a24}.sb.b3{background:#d81b60}
.fix .emoji{font-size:40px;line-height:48px}
.slot{width:100%;min-height:60px;border:3px dashed #b9abd9;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:4px;background:#faf7ff}
.slot.hot{background:#e8f1ff;border-color:var(--sel)}
.slot.big{min-height:110px}
.slot.correct{border:3px solid var(--good);background:var(--goodbg)}
.slot.wrong{border:3px solid var(--bad);background:var(--badbg)}
.fix{font-size:15px;color:var(--good)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px;padding:14px;border-radius:20px;background:#f6f1ff;min-height:84px}
.chip{border:0;border-radius:16px;padding:12px 20px;font-size:21px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);touch-action:none;user-select:none;-webkit-user-select:none}
.chip.pic{background:#fff;border:3px solid var(--line);padding:6px}
.chip.pic svg{width:84px;height:84px;display:block;pointer-events:none}
.chip.sel{outline:4px solid var(--sel);outline-offset:3px}
.slot .chip{box-shadow:none;width:100%}
.slot .chip.pic svg{margin:0 auto}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.08) rotate(-3deg);opacity:.92}

.fb{margin-top:18px;border-radius:18px;padding:12px 16px;font-size:22px;display:flex;align-items:center;gap:10px}
.fb.ok{background:var(--goodbg);color:#1d6b2c}
.fb.no{background:var(--badbg);color:#a51d1d}
.fb.mid{background:#fff3cd;color:#7a5200}
.fb .em{font-size:36px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:18px;padding:14px 30px;font-size:24px;color:#fff;background:var(--head);box-shadow:0 5px 0 #3e1d66}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3e1d66}
.btn:disabled{opacity:.4;cursor:default}
.btn.green{background:#2f9e44;box-shadow:0 5px 0 #1b5e28}
.btn.orange{background:#f08a24;box-shadow:0 5px 0 #a3560c}

/* Resultado */
.res{text-align:center}
.res .stars{font-size:clamp(60px,14vw,90px);letter-spacing:6px}
.res .stars .off{filter:grayscale(1);opacity:.3}
.res h2{font-size:32px;margin:4px 0}
.res .score{font-size:24px;color:var(--muted)}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:520px){
  .top h1{font-size:20px;padding:12px 64px}
  .oic svg,.tic svg{width:76px;height:76px}
  .tic .emoji{font-size:64px;line-height:76px}
  .row svg,.row .q{width:48px;height:48px}
  .oic .emoji{font-size:64px;line-height:76px}
  .opts,.targets{grid-template-columns:repeat(2,1fr)}
  .opts.list{grid-template-columns:1fr}
  .chip{font-size:18px;padding:10px 14px}
  .chip.pic svg{width:64px;height:64px}
  .card{padding:16px 12px 18px}
}
</style>
</head>
<body>
<header class="top">
  <h1><button class="home" id="homeBtn" hidden>🏠 Inicio</button>MICROSOFT PAINT</h1>
  <div class="sub">EVALUACIÓN MENSUAL</div>
</header>

<main class="wrap">
  <section id="home">
    <div class="hero"><div class="big">🎨</div><h2>Elige tu nivel</h2></div>
    <div class="levels" id="levels"></div>
  </section>

  <section id="subPick" hidden>
    <div class="hero"><div class="big" id="subEmoji"></div><h2 id="subTitle"></h2></div>
    <div class="subs" id="subs"></div>
  </section>

  <section id="quiz" hidden>
    <div class="bar">
      <span class="tag" id="qTag"></span>
      <div class="prog"><i id="qProg"></i></div>
      <span class="count" id="qCount"></span>
    </div>
    <div class="card" id="qCard"></div>
  </section>

  <section id="result" hidden>
    <div class="card res" id="resCard"></div>
  </section>
</main>

<script>
/* ---------- Dibujos (SVG 64×64) ---------- */
const S = 'stroke-width="2.5" stroke-linejoin="round"';
function teclado() {
  let s = `<rect x="3" y="16" width="58" height="34" rx="5" fill="#eceff1" stroke="#37474f" ${S}/>`;
  for (let r = 0; r < 2; r++) for (let c = 0; c < 7; c++)
    s += `<rect x="${8 + c * 7}" y="${21 + r * 8}" width="5.5" height="5.5" rx="1" fill="#90a4ae"/>`;
  return s + '<rect x="17" y="39" width="30" height="6" rx="1.5" fill="#90a4ae"/>';
}
const color = c => `<circle cx="32" cy="32" r="25" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="3"/><circle cx="24" cy="23" r="6" fill="#fff" opacity=".45"/>`;
function sol() {
  let s = '';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
    s += `<line x1="${32 + c * 18}" y1="${32 + n * 18}" x2="${32 + c * 28}" y2="${32 + n * 28}" stroke="#333" stroke-width="3" stroke-linecap="round"/>`;
  }
  return s + '<circle cx="32" cy="32" r="13" fill="#fff" stroke="#333" stroke-width="3"/>';
}
const winBtn = inner => `<rect x="4" y="4" width="56" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="3"/>${inner}`;
const ICONS = {
  lapiz: `<g transform="rotate(40 32 32)"><rect x="25" y="4" width="14" height="40" rx="2" fill="#ffb636" stroke="#5a3d1e" ${S}/><rect x="25" y="4" width="14" height="8" rx="2" fill="#ff7aa2" stroke="#5a3d1e" ${S}/><path d="M25 44 L39 44 L32 60 Z" fill="#f5d6a8" stroke="#5a3d1e" ${S}/><path d="M29.5 54 L34.5 54 L32 60 Z" fill="#333"/></g>`,
  relleno: `<g transform="rotate(-25 28 36)"><path d="M12 24 H44 L40 56 Q28 60 16 56 Z" fill="#8ec5ff" stroke="#24476b" ${S}/><ellipse cx="28" cy="24" rx="16" ry="5" fill="#d9ecff" stroke="#24476b" stroke-width="2.5"/><path d="M14 24 Q28 2 42 24" fill="none" stroke="#24476b" stroke-width="2.5"/></g><path d="M52 30 Q60 44 56 50 A5 5 0 0 1 47 48 Q46 42 52 30 Z" fill="#2f80ed"/>`,
  texto: `<text x="32" y="56" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="700" fill="#6b5b95">A</text>`,
  borrador: `<g transform="rotate(-30 32 34)"><rect x="6" y="22" width="52" height="22" rx="5" fill="#ff9ec4" stroke="#7a2e4f" stroke-width="2.5"/><rect x="6" y="22" width="20" height="22" rx="5" fill="#6fb6ff" stroke="#7a2e4f" stroke-width="2.5"/></g>`,
  lupa: `<circle cx="26" cy="26" r="16" fill="#d8f3ff" stroke="#333" stroke-width="4"/><path d="M19 21 Q23 15 30 16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M38 38 L56 56" stroke="#333" stroke-width="8" stroke-linecap="round"/>`,
  pincel: `<path d="M8 54 Q20 40 36 46" fill="none" stroke="#e74c3c" stroke-width="6" stroke-linecap="round"/><g transform="rotate(45 38 30)"><rect x="34" y="2" width="8" height="30" rx="3" fill="#a0522d" stroke="#4a2511" stroke-width="2"/><rect x="33" y="30" width="10" height="6" fill="#c0c0c0" stroke="#555" stroke-width="2"/><path d="M33 36 H43 Q44 48 38 54 Q32 48 33 36Z" fill="#e74c3c" stroke="#7a1d14" stroke-width="2"/></g>`,
  linea: `<line x1="10" y1="54" x2="54" y2="10" stroke="#333" stroke-width="5" stroke-linecap="round"/><circle cx="10" cy="54" r="5" fill="#2f80ed"/><circle cx="54" cy="10" r="5" fill="#2f80ed"/>`,
  elipse: `<ellipse cx="32" cy="32" rx="27" ry="16" fill="#ffe08a" stroke="#c77d00" stroke-width="4"/>`,
  circulo: `<circle cx="32" cy="32" r="24" fill="#ff8a80" stroke="#c0392b" stroke-width="4"/>`,
  rectangulo: `<rect x="5" y="16" width="54" height="32" fill="#90caf9" stroke="#1565c0" stroke-width="4"/>`,
  triangulo: `<polygon points="32,8 58,54 6,54" fill="#ce93d8" stroke="#6a1b9a" stroke-width="4" stroke-linejoin="round"/>`,
  poligono: `<polygon points="32,6 55,19 55,45 32,58 9,45 9,19" fill="#80deea" stroke="#00838f" stroke-width="4" stroke-linejoin="round"/>`,
  seleccionar: `<rect x="6" y="10" width="46" height="38" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" stroke-dasharray="6 4"/><path d="M40 34 L58 42 L50 45 L47 53 Z" fill="#263238" stroke="#fff" stroke-width="1.5"/>`,
  grosor: `<line x1="8" y1="14" x2="56" y2="14" stroke="#333" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="28" x2="56" y2="28" stroke="#333" stroke-width="5" stroke-linecap="round"/><line x1="8" y1="46" x2="56" y2="46" stroke="#333" stroke-width="11" stroke-linecap="round"/>`,
  garabato: `<path d="M6 42 Q14 14 22 36 T38 30 T58 22" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>`,
  trazo: `<path d="M8 44 Q22 16 36 36 T58 20" fill="none" stroke="#e53935" stroke-width="11" stroke-linecap="round"/>`,
  letras: `<text x="32" y="44" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#1e88e5">Abc</text>`,
  corazon: `<path d="M32 56 C10 40 4 28 12 18 C18 10 28 12 32 20 C36 12 46 10 52 18 C60 28 54 40 32 56Z" fill="#fff" stroke="#333" stroke-width="3"/>`,
  pintado: `<path d="M32 56 C10 40 4 28 12 18 C18 10 28 12 32 20 C36 12 46 10 52 18 C60 28 54 40 32 56Z" fill="#1e88e5" stroke="#0d47a1" stroke-width="3"/>`,
  error: `<path d="M12 30 L32 12 L52 30 V54 H12 Z" fill="#fff8e1" stroke="#5d4037" stroke-width="3" stroke-linejoin="round"/><rect x="26" y="38" width="12" height="16" fill="#a1887f"/><path d="M14 20 Q22 4 28 22 T42 18 T56 32 T38 44" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/>`,
  estrella: `<polygon points="32,5 39,24 59,24 43,36 49,56 32,44 15,56 21,36 5,24 25,24" fill="#ffd54f" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>`,
  mouse: `<rect x="18" y="8" width="28" height="48" rx="14" fill="#eceff1" stroke="#37474f" ${S}/><line x1="32" y1="8" x2="32" y2="28" stroke="#37474f" stroke-width="2.5"/><line x1="18" y1="28" x2="46" y2="28" stroke="#37474f" stroke-width="2.5"/><rect x="30" y="14" width="4" height="8" rx="2" fill="#37474f"/>`,
  monitor: `<rect x="4" y="8" width="56" height="38" rx="3" fill="#37474f"/><rect x="8" y="12" width="48" height="30" fill="#4fc3f7"/><rect x="26" y="46" width="12" height="7" fill="#546e7a"/><rect x="18" y="53" width="28" height="4" rx="2" fill="#37474f"/>`,
  sol: sol(),
  hoja: `<path d="M10 54 C10 24 30 8 56 8 C56 34 40 54 10 54 Z" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/><path d="M10 54 L44 20" stroke="#333" stroke-width="2.5"/>`,
  agrandar: `<circle cx="11" cy="42" r="6" fill="#ff8a80" stroke="#c0392b" stroke-width="2"/><path d="M21 42 H29 M25 38 L29 42 L25 46" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="34" r="15" fill="#ff8a80" stroke="#c0392b" stroke-width="3"/>`,
  borrado: `<path d="M32 56 C10 40 4 28 12 18 C18 10 28 12 32 20 C36 12 46 10 52 18 C60 28 54 40 32 56Z" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="7 7" opacity=".45"/><circle cx="50" cy="52" r="2.5" fill="#ff9ec4"/><circle cx="56" cy="47" r="2" fill="#ff9ec4"/><circle cx="46" cy="58" r="2" fill="#ff9ec4"/>`,
  hojaBlanca: `<rect x="10" y="6" width="44" height="52" rx="3" fill="#fff" stroke="#90a4ae" stroke-width="2.5"/>`,
  guardar: `<rect x="6" y="6" width="52" height="52" rx="5" fill="#5c6bc0" stroke="#283593" stroke-width="2.5"/><rect x="16" y="6" width="28" height="18" fill="#e8eaf6" stroke="#283593" stroke-width="2"/><rect x="34" y="9" width="6" height="12" fill="#283593"/><rect x="14" y="34" width="36" height="20" rx="2" fill="#fff"/>`,
  curva: `<path d="M8 50 C20 4 44 60 56 14" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/><circle cx="8" cy="50" r="4.5" fill="#2f80ed"/><circle cx="56" cy="14" r="4.5" fill="#2f80ed"/>`,
  aerografo: `<rect x="14" y="24" width="22" height="34" rx="4" fill="#ef5350" stroke="#7a1d14" stroke-width="2.5"/><rect x="19" y="14" width="12" height="10" fill="#bdbdbd" stroke="#555" stroke-width="2"/><g fill="#ef5350"><circle cx="42" cy="14" r="2"/><circle cx="49" cy="10" r="2"/><circle cx="47" cy="19" r="2"/><circle cx="55" cy="15" r="2"/><circle cx="54" cy="24" r="2"/><circle cx="58" cy="7" r="1.6"/><circle cx="60" cy="20" r="1.6"/></g>`,
  cuentagotas: `<g transform="rotate(45 32 32)"><rect x="28" y="2" width="8" height="14" rx="4" fill="#424242"/><rect x="26" y="16" width="12" height="5" fill="#757575"/><path d="M29 21 H35 V48 L32 58 L29 48 Z" fill="#e3f2fd" stroke="#455a64" stroke-width="2"/><path d="M29 36 H35 V48 L32 58 L29 48 Z" fill="#1e88e5"/></g>`,
  recta: `<line x1="8" y1="52" x2="56" y2="12" stroke="#333" stroke-width="4" stroke-linecap="round"/>`,
  rojo: color('#e53935'), azul: color('#1e88e5'), amarillo: color('#fdd835'), verde: color('#43a047'),
  teclado: teclado(),
  papelera: `<rect x="12" y="12" width="40" height="6" rx="2" fill="#90a4ae" stroke="#37474f" ${S}/><rect x="26" y="6" width="12" height="6" rx="2" fill="none" stroke="#37474f" stroke-width="2.5"/><path d="M16 18 H48 L45 58 H19 Z" fill="#cfd8dc" stroke="#37474f" ${S}/><path d="M26 26 L27 50 M32 26 V50 M38 26 L37 50" stroke="#37474f" stroke-width="2.5"/>`,
  btnMin: winBtn(`<line x1="18" y1="44" x2="46" y2="44" stroke="#263238" stroke-width="5" stroke-linecap="round"/>`),

      { q: '¿Cuál es el SELECTOR DE COLOR? Copia un color del dibujo', hideText: true, opts: [{ ic: 'cuentagotas', t: 'Selector de color', ok: 1 }, { ic: 'relleno', t: 'Relleno' }, { ic: 'lupa', t: 'Lupa' }] },
      { q: 'Con la herramienta SELECCIONAR puedo…', img: 'seleccionar', opts: [{ t: 'Mover una parte del dibujo', ok: 1 }, { t: 'Pintar toda la hoja' }, { t: 'Escribir letras' }] },
      { q: '¿Qué teclas COPIAN lo que seleccioné?', opts: [{ kbd: 'Ctrl + C', ok: 1 }, { kbd: 'Ctrl + V' }, { kbd: 'Ctrl + Z' }] },
      { q: '¿Qué teclas PEGAN lo que copié?', opts: [{ kbd: 'Ctrl + V', ok: 1 }, { kbd: 'Ctrl + C' }, { kbd: 'Ctrl + P' }] },
      { q: 'Para pintar con el COLOR 1 hago clic con el botón…', img: 'mouse', opts: [{ t: 'Izquierdo del mouse', ok: 1 }, { t: 'Derecho del mouse' }, { t: 'De la impresora' }] },
      { q: 'Para hacer un CUADRADO perfecto con el rectángulo, mantengo presionada la tecla…', opts: [{ kbd: 'Shift', ok: 1 }, { kbd: 'Enter' }, { kbd: 'Espacio' }] },
      { q: '¿Cuál palabra está en CURSIVA?', hideText: true, opts: [{ html: '<i>Sol</i>', t: 'Cursiva', ok: 1 }, { html: '<b>Sol</b>', t: 'Negrita' }, { html: '<u>Sol</u>', t: 'Subrayado' }] },
      { q: '¿Cuál palabra está SUBRAYADA?', hideText: true, opts: [{ html: '<u>Sol</u>', t: 'Subrayado', ok: 1 }, { html: '<i>Sol</i>', t: 'Cursiva' }, { html: '<b>Sol</b>', t: 'Negrita' }] },
      { q: 'Si mi dibujo tiene un hueco (no está cerrado) y uso el RELLENO…', img: 'relleno', opts: [{ t: 'Se pinta también todo lo de afuera', ok: 1 }, { t: 'No se pinta nada' }, { t: 'Se borra el dibujo' }] },
      { q: 'Para ABRIR un dibujo que ya guardé voy a…', opts: [{ t: 'Archivo → Abrir', ok: 1 }, { t: 'Archivo → Nuevo' }, { t: 'Archivo → Imprimir' }] }
    ] },
    { name: 'Avanzado', qs: [
      { type: 'match', mode: 'num', q: 'Ordena los pasos para hacer un dibujo y guardarlo', pairs: [
        { t: 'Abrir Paint' }, { t: 'Dibujar con las herramientas' }, { t: 'Pintar con el relleno' }, { t: 'Archivo → Guardar' }] },
      { type: 'match', q: 'Arrastra el nombre a cada herramienta', pairs: [
        { ic: 'cuentagotas', t: 'SELECTOR DE COLOR', c: '#455a64' }, { ic: 'aerografo', t: 'AERÓGRAFO', c: '#e53935' }, { ic: 'curva', t: 'CURVA', c: '#8e24aa' },
        { ic: 'seleccionar', t: 'SELECCIONAR', c: '#d81b60' }, { ic: 'lupa', t: 'LUPA', c: '#f2b705' }, { ic: 'relleno', t: 'RELLENO', c: '#43a047' }] },
      { q: '¿Qué teclas GUARDAN mi dibujo?', opts: [{ kbd: 'Ctrl + G', ok: 1 }, { kbd: 'Ctrl + P' }, { kbd: 'Ctrl + Z' }] },
      { q: '¿Qué teclas REHACEN lo que deshice?', opts: [{ kbd: 'Ctrl + Y', ok: 1 }, { kbd: 'Ctrl + Z' }, { kbd: 'Ctrl + C' }] },
      { q: 'Quiero que TODA mi imagen sea más pequeña. Uso…', opts: [{ t: 'Cambiar tamaño', ok: 1 }, { t: 'Girar' }, { t: 'Relleno' }] },
      { q: 'RECORTAR sirve para…', opts: [{ t: 'Quedarme solo con la parte que seleccioné', ok: 1 }, { t: 'Pintar el fondo' }, { t: 'Hacer las letras más grandes' }] },
      { q: 'Quiero escribir con letras más GRANDES. En Texto cambio…', img: 'texto', opts: [{ t: 'El tamaño de la fuente', ok: 1 }, { t: 'El grosor del pincel' }, { t: 'El color 2' }] },
      { q: 'En Texto, ¿qué opción deja ver el dibujo detrás de las letras?', opts: [{ t: 'Transparente', ok: 1 }, { t: 'Opaco' }, { t: 'Negrita' }] },
      { q: 'El COLOR 2 es el color que pinto con…', opts: [{ t: 'El clic derecho del mouse', ok: 1 }, { t: 'El clic izquierdo del mouse' }, { t: 'La tecla Enter' }] },
      { q: 'Si pongo la lupa (zoom) en 200 %, veo mi dibujo…', img: 'lupa', opts: [{ t: 'Dos veces más grande', ok: 1 }, { t: 'Más pequeño' }, { t: 'Igual' }] },
      { q: '¿Qué botón MINIMIZA la ventana de Paint?', img: 'ventana', hideText: true, opts: [{ ic: 'btnMin', t: 'Minimizar', ok: 1 }, { ic: 'btnMax', t: 'Maximizar' }, { ic: 'btnCerrar', t: 'Cerrar' }] },
      { q: '¿Dónde está la opción IMPRIMIR en Paint?', opts: [{ t: 'En el menú Archivo', ok: 1 }, { t: 'En la paleta de colores' }, { t: 'En la herramienta Texto' }] }
    ] }]
  }
];

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES'; u.rate = .9; u.pitch = 1.1;
  const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
let actx;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (good ? [660, 880, 1320] : [300, 220]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .11;
      o.type = good ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .2);
    });
  } catch (e) {}
}

/* ---------- Pantallas ---------- */
let st = null;
function show(id) {
  document.querySelectorAll('.confetti').forEach(c => c.remove());
  ['home', 'subPick', 'quiz', 'result'].forEach(s => $(s).hidden = s !== id);
  $('homeBtn').hidden = id === 'home';
  window.scrollTo(0, 0);
}
function goHome() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  window.onpointermove = window.onpointerup = null;
  st = null;
  show('home');
}
$('homeBtn').onclick = goHome;

$('levels').innerHTML = LEVELS.map(L => `
  <button class="lvl" style="background:${L.color}" data-l="${L.id}">
    <div class="e">${L.emoji}</div><div class="n">${L.name}</div><div class="a">${L.age}</div>
  </button>`).join('');
$('levels').onclick = e => {
  const b = e.target.closest('.lvl'); if (!b) return;
  pickSub(LEVELS.find(l => l.id == b.dataset.l));
};
const SUBS = [{ e: '🌱', s: '⭐' }, { e: '🌿', s: '⭐⭐' }, { e: '🌳', s: '⭐⭐⭐' }];
function pickSub(L) {
  st = null;
  $('subEmoji').textContent = L.emoji;
  $('subTitle').textContent = `${L.name} · ${L.age}`;
  $('subs').innerHTML = L.subs.map((sb, k) => `
    <button class="sb b${k + 1}" data-k="${k}"><span class="e">${SUBS[k].e}</span>
      <span><span class="n">${sb.name}</span><br><span class="s">${SUBS[k].s}</span></span></button>`).join('');
  $('subs').onclick = e => { const b = e.target.closest('.sb'); if (b) start(L, +b.dataset.k); };
  show('subPick');
  if (L.noRead) speak('Elige: básico, medio o avanzado');
}
function start(L, k) { st = { L, k, qs: L.subs[k].qs, i: 0, score: 0 }; renderQ(); }

function sayText(q, L) {
  let s = q.q;
  if (q.opts && !L.noRead && !q.hideText) s += '. ' + q._opts.map(o => o.t || o.kbd).join('. ');
  return s;
}
function renderQ() {
  const { L, i, qs } = st, q = qs[i];
  show('quiz');
  $('qTag').textContent = `${L.emoji} ${L.name} · ${L.subs[st.k].name}`;
  $('qTag').style.background = L.color;
  $('qProg').style.width = (i / qs.length * 100) + '%';
  $('qCount').textContent = `${i + 1} de ${qs.length}`;
  $('qCard').innerHTML = `
    <div class="qhead"><div class="qtext">${q.q}</div><button class="say" id="sayBtn" title="Escuchar">🔊</button></div>
    ${q.img ? `<div class="qimg">${ic(q.img)}</div>` : ''}
    ${q.row ? `<div class="row">${q.row.map(ic).join('')}<span class="q">?</span></div>` : ''}
    ${q.type === 'match' ? matchHTML(q) : choiceHTML(q, L)}
    <div id="fb"></div>
    <div class="actions" id="acts"></div>`;
  $('sayBtn').onclick = () => speak(sayText(q, L));
  if (q.type === 'match') bindMatch(q); else bindChoice(q);
  if (L.noRead) setTimeout(() => { if (st && st.qs[st.i] === q) speak(sayText(q, L)); }, 250);
}

/* ---------- Opción múltiple ---------- */
function optHTML(o, hideText) {
  const vis = o.ic ? `<div class="oic">${ic(o.ic)}</div>`
    : o.kbd ? `<div class="okbd">${o.kbd.split('+').map(k => `<kbd>${k.trim()}</kbd>`).join('<span>+</span>')}</div>`
    : o.html ? `<div class="ohtml">${o.html}</div>` : '';
  return vis + (o.t && !hideText ? `<div class="otxt">${o.t}</div>` : '');
}
function choiceHTML(q, L) {
  q._opts = shuffle(q.opts);
  const list = q._opts.every(o => !o.ic && !o.kbd && !o.html) || (q._opts.length === 4 && !L.noRead);
  return `<div class="opts ${list ? 'list' : ''}">${q._opts.map((o, i) =>
    `<button class="opt" data-i="${i}">${optHTML(o, q.hideText || L.noRead)}</button>`).join('')}</div>`;
}
function bindChoice(q) {
  const box = $('qCard').querySelector('.opts');
  box.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || box.dataset.done) return;
    box.dataset.done = 1;
    const ok = !!q._opts[b.dataset.i].ok;
    box.querySelectorAll('.opt').forEach((x, k) => {
      x.disabled = true;
      x.classList.add(q._opts[k].ok ? 'correct' : x === b ? 'wrong' : 'dim');
    });
    const right = q._opts.find(x => x.ok);
    finish(ok ? 1 : 0, ok ? '' : `La respuesta era: ${right.t || right.kbd}`, ok ? '' : `Era: ${right.t}`);
  };
}

/* ---------- Arrastrar y soltar (ratón y pantallas táctiles; también se puede tocar y luego tocar la caja) ---------- */
function matchHTML(q) {
  const items = q.pairs.map((p, k) => ({ ...p, key: k }));
  const pic = !!items[0].ic && (q.mode === 'shadow' || q.mode === 'rel' || q.mode === 'num');
  const num = q.mode === 'num';
  const chip = it => pic
    ? `<button class="chip pic" data-k="${it.key}" aria-label="${it.t}">${ic(it.ic)}</button>`
    : `<button class="chip ${num ? 'step' : ''}" data-k="${it.key}" ${it.c ? `style="background:${it.c}"` : ''}>${it.t}</button>`;
  return `<div class="targets ${num ? 'order' : ''} ${num && pic ? 'pics' : ''}">${(num ? items : shuffle(items)).map(it => `
      <div class="target">
        ${num ? `<div class="tnum">${it.key + 1}</div>` : `<div class="tic ${q.mode === 'shadow' ? 'shadow' : ''}">${ic(q.mode === 'rel' ? it.target : it.ic)}</div>`}
        <div class="slot ${pic ? 'big' : ''}" data-k="${it.key}"></div>
      </div>`).join('')}</div>
    <div class="pool" id="pool">${shuffle(items).map(chip).join('')}</div>`;
}
function bindMatch(q) {
  const card = $('qCard'), pool = $('pool');
  $('acts').innerHTML = `<button class="btn green" id="chk" disabled>✔ Revisar</button>`;
  let sel = null, drag = null, done = false;
  const slots = [...card.querySelectorAll('.slot')];
  const refresh = () => { $('chk').disabled = slots.some(s => !s.firstElementChild); };
  const select = c => { if (sel) sel.classList.remove('sel'); sel = c; if (c) c.classList.add('sel'); };
  const place = (c, slot) => {
    if (slot.firstElementChild && slot.firstElementChild !== c) pool.appendChild(slot.firstElementChild);
    slot.appendChild(c); select(null); refresh();
  };

  card.addEventListener('pointerdown', e => {
    const c = e.target.closest('.chip'); if (!c || done) return;
    e.preventDefault();
    drag = { c, x: e.clientX, y: e.clientY, g: null, id: e.pointerId };
  });
  window.onpointermove = e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.g && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.g = drag.c.cloneNode(true); drag.g.classList.add('ghost'); drag.g.classList.remove('sel');
      drag.g.style.width = drag.c.offsetWidth + 'px';
      document.body.appendChild(drag.g); drag.c.style.opacity = .35;
    }
    if (drag.g) {
      // desplazar la página si el dedo llega al borde (pantallas pequeñas)
      if (e.clientY < 40) window.scrollBy(0, -12);
      else if (e.clientY > innerHeight - 40) window.scrollBy(0, 12);
      drag.g.style.left = e.clientX + 'px'; drag.g.style.top = e.clientY + 'px';
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
      slots.forEach(s => s.classList.toggle('hot', s === over));
    }
  };
  window.onpointerup = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { c, g } = drag; drag = null;
    if (g) {
      g.remove(); c.style.opacity = '';
      slots.forEach(s => s.classList.remove('hot'));
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const slot = el?.closest('.slot');
      if (slot) place(c, slot);
      else if (el?.closest('#pool') && c.parentElement !== pool) { pool.appendChild(c); refresh(); }
    } else {
      const inSlot = c.parentElement.classList.contains('slot');
      if (inSlot && sel && sel !== c) place(sel, c.parentElement);
      else if (inSlot && !sel) { pool.appendChild(c); refresh(); }
      else select(sel === c ? null : c);
    }
  };
  card.addEventListener('click', e => {
    if (done) return;
    const slot = e.target.closest('.slot');
    if (slot && sel && !e.target.closest('.chip')) place(sel, slot);
  });

  $('chk').onclick = () => {
    done = true; select(null);
    let good = 0;
    slots.forEach(s => {
      const ok = s.firstElementChild.dataset.k === s.dataset.k;
      s.classList.add(ok ? 'correct' : 'wrong');
      if (ok) good++;
      else {
        const it = q.pairs[s.dataset.k];
        s.insertAdjacentHTML('afterend', `<div class="fix">${it.ic && q.mode ? ic(it.ic) : '✔ ' + it.t}</div>`);
      }
    });
    pool.hidden = true;
    finish(good / slots.length, good === slots.length ? '' : `Acertaste ${good} de ${slots.length}`);
  };
}

/* ---------- Avanzar y resultado ---------- */
const PRAISE = ['¡Muy bien!', '¡Excelente!', '¡Genial!', '¡Súper!'];
function finish(points, msg, say) {
  st.score += points;
  const kind = points === 1 ? 'ok' : points > 0 ? 'mid' : 'no';
  const head = kind === 'ok' ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : kind === 'mid' ? '¡Casi!' : '¡Sigue intentando!';
  $('fb').innerHTML = `<div class="fb ${kind}"><span class="em">${kind === 'ok' ? '🎉' : kind === 'mid' ? '👍' : '💪'}</span><span>${head}${msg ? '<br><small>' + msg + '</small>' : ''}</span></div>`;
  beep(points === 1);
  speak(head + (st.L.noRead && say ? '. ' + say : ''));
  const last = st.i === st.qs.length - 1;
  $('acts').innerHTML = `<button class="btn orange" id="next">${last ? 'Ver mis estrellas ⭐' : 'Siguiente ➜'}</button>`;
  $('next').onclick = () => { st.i++; last ? renderResult() : renderQ(); };
  $('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function renderResult() {
  window.onpointermove = window.onpointerup = null;
  const { L, k, score } = st, total = st.qs.length, pct = score / total, next = L.subs[k + 1];
  const stars = pct >= .85 ? 3 : pct >= .55 ? 2 : 1;
  const title = stars === 3 ? '¡Eres un campeón de Paint!' : stars === 2 ? '¡Muy buen trabajo!' : '¡Buen intento! Practica un poquito más';
  show('result');
  $('resCard').innerHTML = `
    <div class="stars">${[1, 2, 3].map(k => `<span class="${k <= stars ? '' : 'off'}">⭐</span>`).join('')}</div>
    <h2>${title}</h2>
    <div class="score">${L.emoji} ${L.name} · ${L.subs[k].name} · Acertaste ${Math.round(score * 10) / 10} de ${total}</div>
    <div class="actions">
      ${next && stars >= 2 ? `<button class="btn orange" id="up">${SUBS[k + 1].e} Subir a ${next.name}</button>` : ''}
      <button class="btn green" id="again">🔁 Otra vez</button>
      <button class="btn" id="toHome">🏠 Inicio</button>
    </div>`;
  $('again').onclick = () => start(L, k);
  if ($('up')) $('up').onclick = () => start(L, k + 1);
  $('toHome').onclick = goHome;
  speak(title);
  if (stars >= 2) confetti();
}
function confetti() {
  const em = ['🎉', '⭐', '🎨', '🖌️', '✨', '🎈'];
  for (let k = 0; k < 40; k++) {
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = em[k % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
